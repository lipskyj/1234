<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Video → Google Drive</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 560px;
      margin: 64px auto;
      padding: 0 20px;
      color: #1a1a1a;
    }
    h1 { font-size: 22px; }
    p.sub { color: #555; margin-top: -8px; }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 12px;
      padding: 10px 18px;
      font-size: 15px;
      background: #0a66c2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { background: #9bbfe0; cursor: default; }
    #status { margin-top: 20px; font-size: 14px; white-space: pre-wrap; }
    #status.error { color: #b3261e; }
    #status.ok a { color: #0a66c2; }
  </style>
</head>
<body>
  <h1>LinkedIn Video → Google Drive</h1>
  <p class="sub">Paste a link to a LinkedIn post that contains a video. It'll be downloaded and saved to your Drive.</p>

  <input id="url" type="text" placeholder="https://www.linkedin.com/posts/..." />
  <br>
  <button id="go">Download &amp; upload to Drive</button>

  <div id="status"></div>

  <script>
    const btn = document.getElementById('go');
    const input = document.getElementById('url');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
      const url = input.value.trim();
      status.className = '';
      status.textContent = '';
      if (!url) {
        status.className = 'error';
        status.textContent = 'Paste a LinkedIn post URL first.';
        return;
      }

      btn.disabled = true;
      status.textContent = 'Working... this can take a minute for larger videos.';

      try {
        const res = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (!res.ok) {
          status.className = 'error';
          status.textContent = data.error || 'Something went wrong.';
        } else {
          status.className = 'ok';
          status.innerHTML = `Saved "${data.fileName}" to Drive: <a href="${data.driveLink}" target="_blank">${data.driveLink}</a>`;
        }
      } catch (err) {
        status.className = 'error';
        status.textContent = 'Request failed: ' + err;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
